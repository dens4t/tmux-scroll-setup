# ==========================
# TMUX Configuration for pi.dev
# ==========================

# Enable mouse support (scroll, select panes, resize)
set -g mouse on

# Increase scrollback buffer size
set -g history-limit 50000

# Enable vi mode for copy mode
setw -g mode-keys vi

# Enable clipboard integration
set -g set-clipboard on

# Fix colors in tmux
set -g default-terminal "screen-256color"
set -ga terminal-overrides ",xterm-256color:Tc"

# Start window numbering at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Reduce escape time for better vim experience
set -sg escape-time 0

# Display messages for 2 seconds
set -g display-time 2000

# Enable focus events
set -g focus-events on

# ==========================
# Key Bindings for Scrolling
# ==========================

# Enter copy mode with prefix + [
bind [ copy-mode

# Scroll with mouse wheel (already enabled with mouse on)
# But you can also use:
# - Scroll wheel in mouse mode
# - Prefix + [ then use arrow keys or Page Up/Down
# - Prefix + [ then use vi keys (j/k for up/down)

# Copy mode vi bindings
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi C-v send -X rectangle-toggle

# ==========================
# Status Bar
# ==========================

# Update status bar every 5 seconds
set -g status-interval 5

# Status bar colors
set -g status-style bg=colour235,fg=colour136

# Window status
setw -g window-status-current-style bg=colour238,fg=colour166,bold

# Pane border
set -g pane-border-style fg=colour238
set -g pane-active-border-style fg=colour166

# Message style
set -g message-style bg=colour235,fg=colour166

# ==========================
# Useful Info
# ==========================
# To scroll in tmux:
# 1. Mouse wheel scroll (automatically enabled)
# 2. Prefix (Ctrl+b) then [ to enter copy mode
#    - Use arrow keys, Page Up/Down to scroll
#    - Press q to exit copy mode
# 3. In copy mode with vi keys:
#    - j/k to move down/up
#    - Ctrl+d/u for half page down/up
#    - Ctrl+f/b for full page down/up
